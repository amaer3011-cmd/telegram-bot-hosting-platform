services:
  bot-host:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile
    container_name: telegram-bot-host
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    env_file:
      - ../../.env
    environment:
      PORT: "8080"
      DATABASE_PATH: /app/data/hosting.db
      BOTS_DIR: /app/data/uploaded_bots
      # ENCRYPTION_KEY يُقرأ من .env؛ لا تعيّنه هنا فارغًا لأن environment يطغى على env_file
    volumes:
      - bot_data:/app/data
    ports:
      - "8080:8080"
    mem_limit: 2g
    cpus: 2.0
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  bot_data:
