[project]
name = "telegram-bot-hosting"
version = "1.0.0"
description = "Telegram bot hosting control bot"
requires-python = ">=3.11"
dependencies = [
    "python-telegram-bot==21.6",
    "psutil>=5.9,<8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "W", "UP", "B", "SIM", "RUF"]
ignore = ["E501", "RUF001", "SIM105", "SIM108", "SIM115"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
